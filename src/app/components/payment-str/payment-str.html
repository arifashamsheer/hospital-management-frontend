<div class="payment-page">

  <div class="payment-header">

    <div>
      <h1>Complete Payment</h1>

      <p>
        Pay securely for your doctor appointment
      </p>
    </div>

    <button
      mat-stroked-button
      type="button"
      (click)="cancel()"
      [disabled]="isPaying"
    >
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>

  </div>


  <mat-card class="payment-card">

    <mat-card-header>

      <mat-card-title>
        Appointment Payment
      </mat-card-title>

      <mat-card-subtitle>
        Secure payment powered by Stripe
      </mat-card-subtitle>

    </mat-card-header>


    <mat-card-content>

      <div
        class="loading-container"
        *ngIf="isLoading"
      >
        <mat-spinner diameter="45">
        </mat-spinner>

        <p>Preparing secure payment form...</p>
      </div>


      <div
        class="message error-message"
        *ngIf="errorMessage"
      >
        <mat-icon>error_outline</mat-icon>

        <span>
          {{ errorMessage }}
        </span>
      </div>


      <div
        class="message success-message"
        *ngIf="successMessage"
      >
        <mat-icon>check_circle</mat-icon>

        <span>
          {{ successMessage }}
        </span>
      </div>


      <div
        class="payment-content"
        [class.hidden]="isLoading"
      >

        <div class="amount-box">

          <span>Amount to pay</span>

          <strong>
            {{ currency }}
            {{ amount | number:'1.2-2' }}
          </strong>

        </div>


        <form
          (ngSubmit)="payNow()"
        >

          <div
            id="payment-element"
            class="stripe-payment-element"
          >
          </div>


          <div class="payment-actions">

            <button
              mat-stroked-button
              type="button"
              (click)="cancel()"
              [disabled]="isPaying"
            >
              Cancel
            </button>

            <button
              mat-raised-button
              color="primary"
              type="submit"
              [disabled]="
                isLoading ||
                isPaying
              "
            >

              <mat-icon>
                {{
                  isPaying
                    ? 'hourglass_top'
                    : 'lock'
                }}
              </mat-icon>

              {{
                isPaying
                  ? 'Processing...'
                  : 'Pay ' +
                    currency +
                    ' ' +
                    (amount |
                      number:'1.2-2')
              }}

            </button>

          </div>

        </form>

      </div>

    </mat-card-content>

  </mat-card>

</div>
